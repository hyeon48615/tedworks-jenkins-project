name: jenkins

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    volumes:
      - node_home:/home/jenkins
      - node_ssh:/etc/ssh
      - /home/tedworks/tedworks-jenkins-project/scripts:/opt/jenkins/scripts

volumes:
  node_home:
  node_ssh: