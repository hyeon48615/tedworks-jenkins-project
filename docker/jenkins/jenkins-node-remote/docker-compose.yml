services:
  jenkins-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME}
    ports:
      - "2222:22"
    volumes:
      - remote_node_home:/home/jenkins
      - remote_node_ssh:/etc/ssh
      - remote_node_data:/opt/jenkins/data
      - /home/tedworks/scripts:/opt/jenkins/scripts

volumes:
  remote_node_home:
  remote_node_ssh:
  remote_node_data: